<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inverta Studio</title>
    <script>
      // Inverta Studio is a single page; send any unknown path to the app root,
      // derived from the current URL so it works on custom domains and subpaths.
      (function () {
        var root = location.pathname.indexOf('/inverta-studio/') === 0 ? '/inverta-studio/' : '/';
        location.replace(root);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0;URL='./'" /></noscript>
  </head>
  <body>
    <p>Redirecting to <a href="./">Inverta Studio</a>&hellip;</p>
  </body>
</html>
